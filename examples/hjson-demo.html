<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Hjson ↔ JSON — пример на Vue</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body,
        #app {
            height: 100%;
            margin: 0;
        }

        body {
            font: 14px system-ui, sans-serif;
            background: #f5f5f5;
            color: #333;
            overflow: hidden;
            /* без скролла у страницы */
        }

        #app {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 12px;
            gap: 10px;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            flex: 0 0 auto;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            flex: 1 1 0;
            min-height: 0;
            /* ключевое: без него grid не сжимается */
        }

        .pane {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            /* ключевое */
            overflow: hidden;
        }

        .pane h2 {
            margin: 0 0 8px;
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: .5px;
            flex: 0 0 auto;
        }

        textarea,
        .tree {
            flex: 1 1 auto;
            min-height: 0;
            /* ключевое */
            width: 100%;
            font: 13px/1.5 ui-monospace, monospace;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            padding: 8px;
            background: #fcfcfc;
        }

        textarea {
            resize: none;
            /* иначе можно растянуть и сломать лэйаут */
            overflow: auto;
        }

        textarea:focus {
            outline: none;
            border-color: #999;
            background: #fff;
        }

        textarea[readonly] {
            background: #f5f5f5;
            color: #555;
        }

        .tree {
            overflow: auto;
            background: #fafafa;
        }

        /* остальные цвета — без изменений */
        .tree .key {
            color: #905;
        }

        .tree .punct {
            color: #999;
        }

        .tree .string {
            color: #690;
        }

        .tree .number {
            color: #07a;
        }

        .tree .boolean {
            color: #c60;
        }

        .tree .null {
            color: #999;
            font-style: italic;
        }

        .tree .branch {
            padding-left: 1em;
            border-left: 1px dotted #ddd;
            margin-left: 2px;
        }

        .error {
            color: #c00;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
</body>

</html>
